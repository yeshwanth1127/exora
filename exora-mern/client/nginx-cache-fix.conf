# Add this inside your server { } block for exora.solutions
# so index.html is never cached and mobile always gets latest build.
#
# Example: include this file from /etc/nginx/sites-available/exora.solutions
#   include /path/to/client/nginx-cache-fix.conf;

location = /index.html {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Pragma "no-cache";
  add_header Expires "0";
}

# Optional: avoid caching the root path that serves index.html
location = / {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Pragma "no-cache";
  add_header Expires "0";
}
