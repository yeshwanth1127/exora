<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="exoraGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Black background with rounded corners -->
  <rect width="128" height="128" fill="#000000" rx="16"/>
  
  <!-- EXORA text -->
  <text 
    x="64" 
    y="75" 
    font-family="'Courier New', Courier, monospace" 
    font-size="20" 
    font-weight="bold" 
    fill="url(#exoraGradient)" 
    text-anchor="middle" 
    letter-spacing="3"
    style="font-variant-numeric: tabular-nums;">
    EXORA
  </text>
  
  <!-- Optional: Small accent line -->
  <line x1="32" y1="90" x2="96" y2="90" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
</svg>
