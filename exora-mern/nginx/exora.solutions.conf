# Exora main site — HTTPS + static SPA + API proxy (matches namma-cabs / certbot style).
#
# Backend port must match server/.env PORT (currently 5555). If you change PORT, update
# every 127.0.0.1:5555 below and reload nginx.
#
# TLS: Let's Encrypt paths (renewed by certbot). Re-issue / add names:
#   sudo certbot --nginx -d exora.solutions -d www.exora.solutions
#
# Install/update live config (then do not replace with an HTTP-only file):
#   sudo cp /var/www/exora/exora-mern/nginx/exora.solutions.conf /etc/nginx/sites-available/exora.solutions
#   sudo ln -sf /etc/nginx/sites-available/exora.solutions /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name exora.solutions www.exora.solutions;

    root /var/www/exora/exora-mern/client/dist;
    index index.html;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:5555;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5555/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /workflow-required-creds {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /activate-workflow {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /privacy-policy {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /var/www/exora/exora-mern/client/nginx-cache-fix.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/exora.solutions/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/exora.solutions/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.exora.solutions) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = exora.solutions) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name exora.solutions www.exora.solutions;
    return 404; # managed by Certbot
}
